spring.application.name=audit-report-app

server.port=8080

spring.thymeleaf.cache=false

server.servlet.session.timeout=30m

app.version=@project.version@

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,threaddump

# Application information
management.info.env.enabled=true

info.app.name=Audit Reports Application
info.app.description=Spring Security based Audit Reporting Portal
info.app.version=@project.version@