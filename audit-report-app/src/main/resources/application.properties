spring.application.name=audit-report-app

server.port=8080

# MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/auditdb
spring.datasource.username=audituser
spring.datasource.password=Audit@123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
