
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Audit Portal - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 35px;
            width: 340px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,.1);
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .message {
            text-align: center;
            color: red;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>Audit Reports Portal</h2>

    <p style="text-align:center">
        Please sign in to continue
    </p>

    <div class="message" th:if="${param.error}">
        Invalid username or password.
    </div>

    <div class="message"
         style="color:green"
         th:if="${param.logout}">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               autocomplete="username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               autocomplete="current-password"
               required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
